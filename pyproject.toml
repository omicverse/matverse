[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "matverse"
version = "0.1.0"
description = "A materials analysis ecosystem on the AnnData substrate"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["anndata>=0.9", "numpy", "pandas", "pymatgen", "ase"]

[project.optional-dependencies]
matminer = ["matminer"]
mp = ["mp-api"]
mlip = ["mace-torch", "chgnet"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["matverse*"]
