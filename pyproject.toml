[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "matverse"
version = "0.1.71"
description = "A materials analysis ecosystem on the AnnData substrate"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "matverse contributors"}]
keywords = ["materials science", "high-throughput screening", "anndata",
            "density functional theory", "machine learning interatomic potentials"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core stays deliberately small. This ecosystem's dependency conflicts are real
# and current — AMSET pins Python >=3.9 while pymatgen requires >=3.11,
# reaction-network's PyPI release trails its git by two years, matminer has not
# released since April 2024 — so everything beyond this list is an optional
# extra, imported inside the function that needs it and failing with an error
# that names the extra. `pip install matverse` must never break an environment.
dependencies = ["anndata>=0.9", "numpy", "pandas", "scipy", "pymatgen", "ase"]

[project.optional-dependencies]
analysis = ["scikit-learn", "igraph", "leidenalg"]   # mv.tl clustering routes
descriptors = ["dscribe"]                            # mv.feat.soap
multi = ["mudata"]                                   # mv.multi.to_mudata only
plot = ["matplotlib"]                                # mv.pl
ml = ["scikit-learn"]                                # mv.model estimators
matminer = ["matminer"]
cost = ["bibtexparser"]                               # mv.prop.cost price table
screening = ["smact"]                                # mv.gen.compositions
generation = ["pyxtal"]                              # mv.gen.from_symmetry
# Real Kohn-Sham DFT, as a matverse level of theory. GPAW is an ASE
# calculator, so nothing beyond the registration is needed - but a DFT run is
# minutes where a surrogate is milliseconds, which is why it is an extra and
# why the test suite exercises it on one molecule rather than a crystal.
dft = ["gpaw"]
# mv.thermo.calphad. Pinned below 0.11 because 0.11 builds against scipy 1.18,
# which has no manylinux_2_17 wheel — an older glibc cannot get there.
calphad = ["pycalphad<0.11"]
# mv.elec.fermi_surface. IFermi pulls BoltzTraP2, which needs cmake at build
# time and netcdf4 below 1.7 — 1.7.4 has no wheel for an older glibc and its
# source build wants netCDF headers that are not there.
fermi = ["ifermi", "netcdf4<1.7", "cmake"]
# Further foundation potentials, on top of the mace/sevennet/chgnet already
# reachable. matgl carries M3GNet and TensorNet at both PBE and r2SCAN.
# Every foundation potential mv.calc can reach. The older 'mlip' extra below
# is a subset of this and is kept only so an existing install does not break.
potentials = ["matgl", "orb-models", "mace-torch", "chgnet", "sevenn"]
# mv.prop.phonon_at_temperature. hiphive reaches numba through trainstation,
# and numba caps numpy below 2.5, so this extra cannot share an environment
# with the newest numpy. It is tested in its own CI job for that reason rather
# than added to the others.
anharmonic = ["hiphive"]
diffusion = ["pymatgen-analysis-diffusion"]           # mv.md.rdf, mv.md.sites,
                                                     # mv.neb.percolation
# mv.gen.alloy_pairs, plus mv.disorder.cluster_expansion and
# mv.disorder.monte_carlo, which drive smol.
alloys = ["pymatgen-analysis-alloys", "smol"]
# mv.mol.functional_groups. openbabel additionally needs libXrender at
# runtime, which pip cannot supply - every format plugin links against it
# through cairo, and without it the bindings fail to import with a
# ValueError from the format table rather than a missing-library error.
molecules = ["openbabel-wheel"]
# mv.prop.phonon(method='phonopy') and mv.prop.dispersion. seekpath is
# separate from phonopy and is what supplies the high-symmetry path, so a
# phonopy without it computes a density of states but no dispersion.
phonons = ["phonopy", "seekpath"]
defects = ["pymatgen-analysis-defects"]              # interstitial and antisite
                                                     # kinds of mv.pp.defects
mp = ["mp-api>=0.46.2"]                              # Delta-table data products
mlip = ["mace-torch"]                                # subset of 'potentials'
# Batched GPU molecular dynamics. torch-sim-atomistic requires Python >= 3.11
# (>= 3.12 from its 0.4 line) while matverse's own floor is 3.10, so this extra
# is installable only on a newer interpreter. mv.md.batched_available() reports
# which situation an installation is in, and the ASE path works regardless.
batched = ["torch-sim-atomistic"]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/omicverse/matverse"
Source = "https://github.com/omicverse/matverse"
Issues = "https://github.com/omicverse/matverse/issues"

[tool.setuptools.packages.find]
include = ["matverse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:spglib.*",
    "ignore:Transforming to str index:UserWarning",
]
