version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_install:
      # Install matverse itself so autodoc can import it and the API generator
      # can read the registry. Optional backends stay out; conf.py mocks them.
      - pip install -e .

sphinx:
  configuration: matverse_guide/docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: matverse_guide/requirements.txt

formats:
  - htmlzip
