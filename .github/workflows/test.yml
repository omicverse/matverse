name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor and 3.12 is where the newest pandas and
        # numpy live. Both are load-bearing: pandas 3.0 string dtypes and its
        # read-only to_numpy caught two real bugs that 3.10 hid, so testing only
        # the floor would have shipped them.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # analysis and plot are installed because a third of the suite covers
          # mv.tl's clustering routes and mv.pl, and skipping them silently
          # would leave the badge green over untested code.
          #
          # diffusion, defects and alloys are pymatgen's own add-on packages.
          # Without
          # them roughly forty tests skip, five more fail outright, and the
          # pymatgen coverage meter measures a smaller pymatgen than the one
          # matverse is claiming to cover — it read 100 modules against a floor
          # of 111 purely because half the add-ons were absent.
          sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1
          pip install -e ".[dev,analysis,plot,multi,diffusion,defects,alloys,molecules,phonons,screening,generation]"

      - name: Show the environment the results belong to
        run: |
          python -c "
          import importlib.metadata as m
          for p in ('numpy','pandas','scipy','pymatgen','ase','anndata'):
              print(f'{p:10s} {m.version(p)}')
          "

      - name: Test
        run: pytest -q --durations=10

      - name: Contract-verified rate
        # Every registry claim is checked by execution rather than asserted.
        # Printed on every run so a drop is visible in the log, not only in a
        # failing assertion.
        run: pytest tests/test_contracts.py -q -s -k "rate or audit"

  calculators:
    # GPAW and the torch-backed potentials get a job of their own. GPAW has no
    # wheel and compiles against libxc and BLAS, which the runner does not
    # carry by default; matgl and orb-models pull torch, which nothing else in
    # this matrix needs. Putting either in the main legs would make all three
    # pay for one job's worth of coverage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxc-dev libopenblas-dev
          pip install -e ".[dev,plot,potentials,dft]"

      - name: Show what is actually installed
        run: |
          python -c "
          import matverse as mv
          for name, meta in sorted(mv.calc.available().items()):
              state = meta.get('unavailable', meta.get('method'))
              print(f'{name:16s} {state}')
          "

      - name: Test the levels of theory
        # The GPAW case is one H2 molecule in LCAO, about three seconds. The
        # crystal validations behind the numbers in the notes take minutes
        # each and are not run here.
        run: |
          pytest tests/test_pipeline.py -q \
            -k "LevelsOfTheory or MatglStress or RealDFT" --durations=5

  anharmonic:
    # A job of its own, because hiphive reaches numba through trainstation and
    # numba caps numpy below 2.5. Installing it alongside the others would
    # quietly downgrade numpy on the 3.12 leg, which exists precisely to test
    # the newest numpy — the extra would be tested at the cost of no longer
    # testing what that leg is for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,phonons,anharmonic]"

      - name: Show that numpy really is the older line here
        run: |
          python -c "
          import importlib.metadata as m
          for p in ('numpy','hiphive','phonopy'):
              print(f'{p:10s} {m.version(p)}')
          "

      - name: Test the self-consistent phonons
        # Slow — the self-consistent solves dominate, and they are run past
        # the defaults on purpose because these tests assert a specific
        # physical outcome and so have to be where it has converged.
        run: pytest tests/test_physics.py -q -k "SelfConsistentPhonons" --durations=5

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Same add-ons as the test job: the tutorials call into both, and a
          # docs build that silently skipped those cells would document a
          # matverse nobody runs.
          sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1
          pip install -e ".[diffusion,defects,alloys,molecules,phonons,screening,generation]"
          pip install -r matverse_guide/requirements.txt

      - name: Execute the tutorial notebooks
        # myst-nb runs with nb_execution_mode = "off" and renders stored
        # outputs, so nothing here would catch a tutorial whose code stopped
        # working. Running them is what makes the tutorials tested rather than
        # merely written; the script exits non-zero if any cell raised, and
        # also if any registered function appears in no notebook at all.
        #
        # data_io queries OQMD over OPTIMADE, so this step needs network. If a
        # provider is down the step fails, which is noisy but honest — the
        # alternative is a tutorial that claims to query a live database and
        # quietly does not.
        working-directory: matverse_guide/docs
        run: |
          pip install matplotlib scikit-learn
          python _scripts/build_notebooks.py

      - name: Build the guide
        # api/user.md is regenerated from the registry by conf.py, so this also
        # checks that a newly decorated function reaches the documentation.
        working-directory: matverse_guide/docs
        run: python -m sphinx -b html -E . _build/html

      - uses: actions/upload-artifact@v4
        with:
          name: guide
          path: matverse_guide/docs/_build/html
          retention-days: 7
